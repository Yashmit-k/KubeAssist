apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-app
  namespace: kubeassist-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-app
  template:
    metadata:
      labels:
        app: crashloop-app
    spec:
      containers:
        - name: application
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Application starting"
              echo "FATAL: database configuration is invalid" >&2
              sleep 2
              exit 1