# The app runs fine (no restarts) but its readiness probe checks a path
# that never succeeds, so it is never Ready and gets no Service traffic.
# Expected detector result: ReadinessFailure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-failure
  namespace: kubeassist-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readiness-failure
  template:
    metadata:
      labels:
        app: readiness-failure
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz/dependencies
              port: 80
            periodSeconds: 5
            failureThreshold: 1
