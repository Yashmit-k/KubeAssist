# Init container always exits 1, so it never lets the main container
# start. Expected detector result: InitContainerFailure.
apiVersion: v1
kind: Pod
metadata:
  name: init-container-failure
  namespace: kubeassist-lab
  labels:
    app: init-container-failure
spec:
  initContainers:
    - name: wait-for-db
      image: busybox:1.36
      command: ["sh", "-c", "echo 'checking database...'; sleep 2; echo 'fatal: database unreachable'; exit 1"]
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
