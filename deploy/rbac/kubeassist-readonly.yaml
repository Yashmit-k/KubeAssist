# Read-only identity for the KubeAssist backend when it runs IN a
# cluster (local mode with in-cluster credentials). The agent manifest
# generated by POST /api/clusters carries its own equivalent role.
#
# Rules are get/list/watch only. Secrets are deliberately absent: missing
# Secret references are diagnosed from container state and events, never
# by reading Secret objects. ConfigMaps are readable so pass-2 collection
# can report which referenced KEYS exist (Kubernetes RBAC cannot grant
# key names without values; the collector only ever sends key names).
apiVersion: v1
kind: Namespace
metadata:
  name: kubeassist
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeassist-backend
  namespace: kubeassist
  labels:
    app.kubernetes.io/name: kubeassist
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeassist-readonly
  labels:
    app.kubernetes.io/name: kubeassist
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "pods/log", "events", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeassist-readonly
  labels:
    app.kubernetes.io/name: kubeassist
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeassist-readonly
subjects:
  - kind: ServiceAccount
    name: kubeassist-backend
    namespace: kubeassist
