# Deploys the agent binary into your OWN Kind cluster, configured to
# connect back OUT to the main backend running on your host machine.
# This proves the whole relay loop end-to-end without needing a second
# real cluster: Kind's node containers can reach your Mac via the
# special DNS name "host.docker.internal", which Docker Desktop
# provides automatically for exactly this "container reaching the
# host" scenario.
#
# Prerequisites:
#   1. Build and load the agent image into Kind (Kind has its own
#      internal image store, separate from Docker Desktop's):
#        docker build -f Dockerfile.agent -t kubeassist-agent:dev .
#        kind load docker-image kubeassist-agent:dev --name kubeassist-dev
#   2. Run the main backend on your host with AGENT_TOKENS set:
#        export AGENT_TOKENS="kind-dev:test-secret-123"
#        go run ./cmd/server
#   3. kubectl apply -f k8s/lab-examples/agent-test.yaml
#   4. kubectl logs -l app=kubeassist-agent -f
#      — should show "agent: connected to relay as cluster \"kind-dev\""
#   5. curl -X POST http://localhost:8080/api/remote/kind-dev/pods/default/<some-pod>/troubleshoot
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeassist-agent
  namespace: kubeassist
  labels:
    app: kubeassist-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeassist-agent
  template:
    metadata:
      labels:
        app: kubeassist-agent
    spec:
      serviceAccountName: kubeassist-backend # reuses the read-only RBAC from k8s/rbac/rbac.yaml
      containers:
        - name: agent
          image: kubeassist-agent:dev
          imagePullPolicy: Never # use the image already loaded into Kind, don't try to pull from a registry
          env:
            - name: RELAY_URL
              value: "ws://host.docker.internal:8080/agent/connect"
            - name: CLUSTER_ID
              value: "kind-dev"
            - name: AGENT_TOKEN
              value: "test-secret-123" # must match AGENT_TOKENS on the backend
