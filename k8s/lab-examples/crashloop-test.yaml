# Deliberately crash-looping pod for testing detect.detectCrashLoopBackOff.
# The container runs `sh -c "exit 1"` — starts, exits immediately with a
# nonzero code, and kubelet restarts it with exponential backoff,
# eventually setting waiting.reason = "CrashLoopBackOff" after enough
# rapid restarts. Apply with:
#   kubectl apply -f crashloop-test.yaml
#   kubectl get pods -w -l app=crashloop-test
# Wait ~2-3 restarts (about 30-60s) before curling the troubleshoot
# endpoint — right after `kubectl apply`, the pod is still in its first
# "Error" waiting state, not yet CrashLoopBackOff (Kubernetes only uses
# that reason after the backoff delay kicks in on repeated failures).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-test
  labels:
    app: crashloop-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-test
  template:
    metadata:
      labels:
        app: crashloop-test
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'starting up...'; sleep 2; echo 'fatal: simulated crash'; exit 1"]
