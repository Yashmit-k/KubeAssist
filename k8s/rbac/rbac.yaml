# ---------------------------------------------------------------------
# ServiceAccount: the IDENTITY the Go backend authenticates as when
# running INSIDE the cluster (in-cluster config, per internal/k8s).
# Every Pod runs as some ServiceAccount — if you don't specify one, it
# gets the namespace's "default" ServiceAccount, which typically has
# NO permissions at all (a safe default). We create a dedicated one so
# we can bind SPECIFIC, MINIMAL permissions to it, rather than either
# using "default" (usually can't do anything, including what we DO
# need) or accidentally over-granting cluster-admin.
# ---------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeassist-backend
  namespace: kubeassist
---
# ---------------------------------------------------------------------
# ClusterRole: the PERMISSIONS THEMSELVES — a set of (verb, resource)
# pairs. This is a ClusterRole (not a namespaced Role) because the
# plan's UI needs to browse namespaces and pods CLUSTER-WIDE, not just
# within one namespace. Read Section 10 of the plan carefully: this is
# INTENTIONALLY read-only. There is no "delete", "create", "patch", or
# "update" verb anywhere below, and Secrets are deliberately absent
# (per "Avoid Secret get" — even read access to Secret VALUES is
# excluded; we only ever reference Secret NAMES, which come from a
# ConfigMap/Secret ENVELOPE reference on the Pod spec itself, not from
# fetching the Secret object).
# ---------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeassist-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # ConfigMaps are readable (their KEYS may be useful evidence for
  # CreateContainerConfigError diagnosis) but note: this grants read
  # access to ConfigMap VALUES too, since Kubernetes' RBAC model can't
  # partially restrict fields within a resource type. If a ConfigMap
  # ever holds sensitive (non-Secret) data, that's a violation of
  # Kubernetes best practice on the CLUSTER's part, not ours — Secrets
  # exist specifically so sensitive data doesn't live in ConfigMaps.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
# ---------------------------------------------------------------------
# ClusterRoleBinding: connects the ServiceAccount (WHO) to the
# ClusterRole (WHAT THEY CAN DO). Without this binding, the
# ServiceAccount and ClusterRole above are just inert objects with no
# effect — RBAC in Kubernetes is always a three-part system:
# Subject (ServiceAccount) + Role/ClusterRole (permissions) + Binding
# (the actual grant).
# ---------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeassist-readonly-binding
subjects:
  - kind: ServiceAccount
    name: kubeassist-backend
    namespace: kubeassist
roleRef:
  kind: ClusterRole
  name: kubeassist-readonly
  apiGroup: rbac.authorization.k8s.io
