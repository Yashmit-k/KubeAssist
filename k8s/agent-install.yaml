# KubeAssist Agent — installer manifest
#
# This is what gets applied when a user registers a cluster via the
# frontend's "Connect Your Cluster" flow (POST /api/clusters). The
# frontend fills in the three CHANGE_ME placeholders below using the
# response from that call and renders this as a copy-pasteable block —
# see internal/api's handleRegisterCluster and the frontend prompt's
# Phase 7 for how those three values get generated.
#
# Manual use: replace the three placeholders yourself and
#   kubectl apply -f agent-install.yaml
#
# Unlike k8s/lab-examples/agent-test.yaml (which was built for
# same-machine Kind testing only — imagePullPolicy: Never, a locally
# `kind load`ed image, host.docker.internal), this manifest pulls a
# REAL published image and works against any real cluster with normal
# internet egress.
apiVersion: v1
kind: Namespace
metadata:
  name: kubeassist
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeassist-agent
  namespace: kubeassist
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeassist-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeassist-agent-readonly-binding
subjects:
  - kind: ServiceAccount
    name: kubeassist-agent
    namespace: kubeassist
roleRef:
  kind: ClusterRole
  name: kubeassist-agent-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeassist-agent
  namespace: kubeassist
  labels:
    app: kubeassist-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeassist-agent
  template:
    metadata:
      labels:
        app: kubeassist-agent
    spec:
      serviceAccountName: kubeassist-agent
      containers:
        - name: agent
          # ghcr.io/YOUR_GITHUB_USERNAME/kubeassist-agent:latest once
          # .github/workflows/publish-agent.yml has run at least once
          # (triggered by pushing a version tag, e.g. git tag v0.1.0 &&
          # git push origin v0.1.0).
          image: ghcr.io/CHANGE_ME_GITHUB_USERNAME/kubeassist-agent:latest
          env:
            - name: RELAY_URL
              value: "CHANGE_ME_RELAY_URL" # from POST /api/clusters response, e.g. wss://kubeassist.example.com/agent/connect
            - name: CLUSTER_ID
              value: "CHANGE_ME_CLUSTER_ID" # the name you chose when registering
            - name: AGENT_TOKEN
              value: "CHANGE_ME_TOKEN" # shown ONCE at registration — store it securely
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
