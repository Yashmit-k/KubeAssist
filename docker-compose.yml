# NOTE: once this backend-go/ directory is merged into the full
# Kubernetes-assistant/ monorepo alongside ai-service/ and frontend/,
# this file should move to the REPO ROOT so it can reference
# ../ai-service and ../frontend as build contexts too. For now, this
# covers what backend-go alone needs to run against.
#
# WHY docker-compose AT ALL, GIVEN WE SAID "DON'T DEVELOP GO INSIDE
# DOCKER"?
# This isn't a contradiction of that earlier advice — compose here runs
# Postgres (a real database you don't want to hand-install and manage
# per-teammate) and, once it exists, the Python AI service. The Go
# binary itself, when you're actively coding on it, still runs natively
# via `go run ./cmd/server` on your host, connecting OUT to the
# Postgres container's exposed port. The commented-out `backend-go`
# service below is for when you want to run the FULLY BUILT container
# image (e.g. to sanity-check the Dockerfile itself, or to demo the
# complete stack) — not for day-to-day development.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kubeassist
      POSTGRES_PASSWORD: kubeassist_dev_password
      POSTGRES_DB: kubeassist
    ports:
      # host:container — lets you `go run` the backend on your host and
      # connect to DATABASE_URL=postgres://...@localhost:5432/kubeassist
      - "5432:5432"
    volumes:
      # Named volume persists data across `docker compose down` (but
      # NOT `docker compose down -v`) — without this, every restart
      # loses all investigation history, which is annoying mid-development.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeassist"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Uncomment once ai-service/ exists alongside this directory in the
  # monorepo:
  #
  # ai-service:
  #   build: ../ai-service
  #   environment:
  #     LLM_API_KEY: ${LLM_API_KEY}
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - postgres

  # Uncomment to run the FULLY CONTAINERIZED Go backend instead of
  # `go run` on your host — useful for testing the Dockerfile itself,
  # or a full-stack demo:
  #
  # backend-go:
  #   build: .
  #   environment:
  #     PORT: "8080"
  #     KUBECONFIG: /kubeconfig/config
  #     KUBE_CONTEXT: kind-kubeassist-dev
  #     DATABASE_URL: postgres://kubeassist:kubeassist_dev_password@postgres:5432/kubeassist?sslmode=disable
  #     AI_BASE_URL: http://ai-service:8000
  #     AI_AUTH_TOKEN: dev-shared-token
  #   volumes:
  #     # Mount your HOST kubeconfig read-only so the containerized Go
  #     # backend can still reach a Kind cluster running on the Docker
  #     # Desktop VM — this is a common pattern for "containerized app,
  #     # host-side cluster" setups.
  #     - ~/.kube/config:/kubeconfig/config:ro
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres-data:
