# KubeAssist full stack.
#
#   docker compose up --build            # relay mode: connect clusters via the agent
#   make up-kind                         # + diagnose your local Kind cluster directly
#
# UI: http://localhost:3000   API: http://localhost:8080   AI: http://localhost:8000
# Copy .env.example to .env to set secrets and an LLM key.

name: kubeassist

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kubeassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kubeassist_dev_password}
      POSTGRES_DB: kubeassist
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeassist"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      AI_SHARED_TOKEN: ${AI_SHARED_TOKEN:-dev-shared-token-change-me}
      LLM_MOCK: ${LLM_MOCK:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_REQUIRE_KEY: ${LLM_REQUIRE_KEY:-true}
      RAG_TOP_K: ${RAG_TOP_K:-5}
    ports:
      - "8000:8000"

  backend:
    build:
      context: backend-go
      args:
        VERSION: ${VERSION:-compose}
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://kubeassist:${POSTGRES_PASSWORD:-kubeassist_dev_password}@postgres:5432/kubeassist?sslmode=disable
      AI_BASE_URL: http://ai-service:8000
      AI_AUTH_TOKEN: ${AI_SHARED_TOKEN:-dev-shared-token-change-me}
      ENABLE_LOCAL_MODE: ${ENABLE_LOCAL_MODE:-false}
      ENABLE_RELAY: "true"
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-ws://localhost:8080/agent/connect}
      AGENT_IMAGE: ${AGENT_IMAGE:-ghcr.io/yashmit-k/kubeassist-agent:latest}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  postgres-data:
