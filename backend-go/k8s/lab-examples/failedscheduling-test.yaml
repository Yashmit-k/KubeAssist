# Requests 100 CPU cores — no single-node Kind cluster can satisfy
# this, so the scheduler can never place the pod, producing a
# FailedScheduling event forever.
apiVersion: v1
kind: Pod
metadata:
  name: failedscheduling-test
  labels:
    app: failedscheduling-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "100"
