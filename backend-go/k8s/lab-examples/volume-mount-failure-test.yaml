# Deliberately references a ConfigMap that doesn't exist, so the pod
# gets stuck Pending with a FailedMount event. Tests detect.detectVolumeMountFailure.
apiVersion: v1
kind: Pod
metadata:
  name: volume-mount-failure-test
  labels:
    app: volume-mount-failure-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: config
          mountPath: /etc/config
  volumes:
    - name: config
      configMap:
        name: this-configmap-does-not-exist
