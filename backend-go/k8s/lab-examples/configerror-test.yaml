# References a key that doesn't exist inside an existing Secret, so the
# kubelet can't build the container's environment and fails with
# CreateContainerConfigError before the container ever starts.
apiVersion: v1
kind: Secret
metadata:
  name: real-secret
type: Opaque
stringData:
  actual-key: "some-value"
---
apiVersion: v1
kind: Pod
metadata:
  name: configerror-test
  labels:
    app: configerror-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: MISSING_VALUE
          valueFrom:
            secretKeyRef:
              name: real-secret
              key: this-key-does-not-exist
