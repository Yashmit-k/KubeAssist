# Memory limit set deliberately low (8Mi) for a workload that allocates
# more than that, triggering a real kubelet OOM kill. Tests
# detect.detectOOMKilled against a REAL OOMKilled event, not a synthetic
# one — this is the one detector we haven't yet proven against a live
# cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-test
  labels:
    app: oom-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-test
  template:
    metadata:
      labels:
        app: oom-test
    spec:
      containers:
        - name: app
          image: busybox:1.36
          resources:
            limits:
              memory: "8Mi"
            requests:
              memory: "8Mi"
          # allocates a large string in a loop until it exceeds 8Mi,
          # triggering the kernel OOM killer inside the container's cgroup
          command: ["sh", "-c", "echo start; A='x'; while true; do A=\"$A$A\"; done"]
